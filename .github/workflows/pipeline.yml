name: Build & Deploy Spring app

on:
  push:
    branches:
      - master

jobs:
  build-deploy:
    name: Build and Deploy Spring Boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'liberica'

      - name: Unit Tests
        run: mvn -B test --file pom.xml

      - name: Build & Package
        run: |
          mvn clean
          mvn -B package --file pom.xml

      - name: Get Deployment Tag from pom.xml
        id: get-version
        uses: mavrosxristoforos/get-xml-info@2.0
        with:
          xml-file: 'pom.xml'
          xpath: '//*[local-name()="project"]/*[local-name()="version"]/text()'

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ secrets.DOCKER_HUB_USERNAME_BE }}/webapp-dropshot-backend:${{ steps.get-version.outputs.info }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME_BE }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN_BE }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME_BE }}/webapp-dropshot-backend:${{ steps.get-version.outputs.info }}